<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de Ruta</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diario de Ruta">
<style>
:root{
  --bg:#000000; --bg-panel:#1C1C1E; --bg-card:#1C1C1E; --bg-input:#2C2C2E;
  --fg:#FFFFFF; --fg-dim:#8E8E93; --accent:#0A84FF; --accent-soft:#5E5CE6;
  --good:#30D158; --bad:#FF453A; --separator:#38383A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html{color-scheme:dark;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;}
.hidden{display:none !important;}
button,input,select,textarea{font-family:var(--font);}

/* ---- Config screen ---- */
#config-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
#config-screen .box{max-width:380px;width:100%;}
.field-label{display:block;font-size:13px;color:var(--fg-dim);margin-bottom:6px;}

/* ---- Topbar ---- */
#topbar{position:sticky;top:0;z-index:20;background:var(--bg-panel);border-bottom:1px solid var(--separator);
  padding-top:env(safe-area-inset-top);}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 6px;}
.app-title{font-size:19px;font-weight:700;}
.date-nav{display:flex;align-items:center;gap:4px;}
.icon{background:none;border:none;color:var(--accent);font-size:19px;padding:4px 8px;cursor:pointer;border-radius:8px;}
.icon:active{background:var(--bg-input);}
.date-input{background:var(--bg-input);color:var(--fg);border:none;border-radius:8px;padding:6px 8px;font-size:14px;}
.date-readable{text-align:center;color:var(--fg-dim);font-size:12px;padding:0 16px 10px;}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;background:var(--bg-input);color:var(--fg-dim);border:none;padding:8px 14px;
  border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;}

/* ---- Content ---- */
#content{max-width:720px;margin:0 auto;padding:16px;padding-bottom:64px;}
.card{background:var(--bg-card);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.card.small{padding:10px 14px;}
.section-title{font-size:14px;color:var(--accent);font-weight:700;margin:22px 0 8px;}
.input,.textarea,.select{width:100%;background:var(--bg-input);color:var(--fg);border:none;border-radius:10px;
  padding:10px 12px;font-size:15px;}
.input::placeholder,.textarea::placeholder{color:var(--fg-dim);}
.textarea{min-height:120px;resize:vertical;line-height:1.4;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.row>*{flex:1;min-width:130px;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;
  font-size:14px;cursor:pointer;}
.btn:active{opacity:.7;}
.btn-secondary{background:var(--bg-input);color:var(--accent);}
.btn-sm{padding:8px 12px;font-size:13px;flex:0 0 auto;min-width:0;}
.btn-x{background:none;border:none;color:var(--fg-dim);font-size:15px;cursor:pointer;padding:4px 9px;
  border-radius:8px;flex:0 0 auto;}
.btn-x:active{background:var(--bg-input);}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--separator);}
.item-row:last-child{border-bottom:none;}
.dim{color:var(--fg-dim);font-size:13px;}
.matriz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}

/* ---- Toast ---- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-input);color:var(--fg);
  padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;}
#toast.show{opacity:1;}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div id="config-screen" class="hidden">
  <div class="box card">
    <div class="app-title" style="margin-bottom:4px;">Diario de Ruta</div>
    <p class="dim" style="margin-top:0;">Conecta este dispositivo con tu servidor para ver los mismos datos en todos lados.</p>
    <label class="field-label">URL del servidor</label>
    <input id="cfg-url" class="input" placeholder="https://tu-app.onrender.com">
    <div style="height:10px;"></div>
    <label class="field-label">Clave API</label>
    <input id="cfg-key" class="input" type="password" placeholder="La misma que pusiste en API_KEY">
    <div style="height:14px;"></div>
    <button id="cfg-guardar" class="btn" style="width:100%;">Conectar</button>
    <button id="cfg-cancelar" class="btn-secondary btn" style="width:100%;margin-top:8px;display:none;">Cancelar</button>
    <div id="cfg-error" class="dim" style="color:var(--bad);margin-top:10px;"></div>
  </div>
</div>

<div id="app-screen" class="hidden"></div>

<div id="toast"></div>

<script>
/* ================= Estado y almacenamiento ================= */
const state = {
  apiBase: localStorage.getItem('dr_api_base') || '',
  apiKey: localStorage.getItem('dr_api_key') || '',
  fecha: todayISO(),
  tab: 'diario',
};
let currentRenderFn = null;

const qs = (sel) => document.querySelector(sel);
const qsa = (sel) => Array.from(document.querySelectorAll(sel));

function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function fechaLegible(iso){
  const dias = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const d = new Date(iso + 'T00:00:00');
  return `${dias[(d.getDay()+6)%7]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function moverFecha(delta){
  const d = new Date(state.fecha + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  state.fecha = d.toISOString().slice(0, 10);
  onFechaChange();
}
function fmtMoneda(n){
  n = Number(n || 0);
  const sign = n < 0 ? '-' : '';
  return `${sign}$${Math.abs(n).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
}
function opcionesCalificacion(sel){
  sel = sel || 3;
  return [1,2,3,4,5].map(n => `<option value="${n}" ${n===sel?'selected':''}>${'★'.repeat(n)}${'☆'.repeat(5-n)}</option>`).join('');
}
function registroRow(r, nombre, action){
  return `<div class="item-row">
    <div>
      <b>${esc(nombre)}</b>
      <div class="dim">${r.tiempo ? esc(r.tiempo)+' · ' : ''}${r.calificacion ? '★'.repeat(r.calificacion)+'☆'.repeat(5-r.calificacion) : ''}</div>
      ${r.nota ? `<div class="dim">${esc(r.nota)}</div>` : ''}
    </div>
    <button class="btn-x" data-action="${action}" data-id="${r.id}">✕</button>
  </div>`;
}
function listaSimple(items, opts){
  if (!items || !items.length) return '<div class="dim">Nada registrado.</div>';
  return items.map(it => `
    <div class="item-row">
      <div>${esc(it[opts.textKey])}${opts.extra ? opts.extra(it) : ''}</div>
      <button class="btn-x" data-action="${opts.action}" data-id="${it.id}">✕</button>
    </div>`).join('');
}
let toastTimer;
function toast(msg){
  const t = qs('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= Cliente API ================= */
async function api(path, opts){
  opts = opts || {};
  const res = await fetch(state.apiBase + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-API-Key': state.apiKey, ...(opts.headers || {}) },
  });
  if (res.status === 401){
    showConfig('Tu clave API ya no es válida. Vuelve a ingresarla.');
    throw new Error('401');
  }
  if (!res.ok){
    let detail = '';
    try { detail = (await res.json()).detail; } catch (e) {}
    throw new Error(detail || `Error ${res.status}`);
  }
  if (res.status === 204) return null;
  return res.json();
}
const get = (p) => api(p);
const post = (p, body) => api(p, { method:'POST', body: JSON.stringify(body) });
const put = (p, body) => api(p, { method:'PUT', body: JSON.stringify(body) });
const patch = (p, body) => api(p, { method:'PATCH', body: body !== undefined ? JSON.stringify(body) : undefined });
const del = (p) => api(p, { method:'DELETE' });

const DELETE_ACTIONS = {
  'del-habito': id => del(`/habitos/${id}`),
  'del-habito-reg': id => del(`/habitos/registro/${id}`),
  'del-tema': id => del(`/temas/${id}`),
  'del-tema-reg': id => del(`/temas/registro/${id}`),
  'del-conocimiento': id => del(`/conocimientos/${id}`),
  'del-proyecto': id => del(`/proyectos/${id}`),
  'del-ejercicio': id => del(`/ejercicios/${id}`),
  'del-alimento': id => del(`/alimentacion/${id}`),
  'del-idea': id => del(`/ideas-negocio/${id}`),
  'del-compra': id => del(`/compras/${id}`),
  'del-cuenta': id => del(`/cuentas/${id}`),
  'del-movimiento': id => del(`/movimientos/${id}`),
  'del-tarea': id => del(`/matriz/${id}`),
};

/* ================= Cascarón de la app ================= */
const TABS = [
  {id:'diario', label:'Diario'},
  {id:'habitos', label:'Hábitos'},
  {id:'conocimiento', label:'Conocimiento'},
  {id:'ejercicio', label:'Ejercicio y sueño'},
  {id:'alimentacion', label:'Alimentación'},
  {id:'finanzas', label:'Finanzas'},
  {id:'matriz', label:'Matriz'},
];

function buildShell(){
  qs('#app-screen').innerHTML = `
    <div id="topbar">
      <div class="header-top">
        <div class="app-title">Diario de Ruta</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="date-nav">
            <button class="icon" id="btn-prev" aria-label="Día anterior">‹</button>
            <input type="date" id="date-picker" class="date-input">
            <button class="icon" id="btn-next" aria-label="Día siguiente">›</button>
          </div>
          <button class="btn-secondary btn btn-sm" id="btn-hoy">Hoy</button>
          <button class="icon" id="btn-settings" aria-label="Configuración">⚙</button>
        </div>
      </div>
      <div class="date-readable" id="date-readable"></div>
      <div class="tabbar" id="tabbar"></div>
    </div>
    <div id="content"></div>
  `;
  qs('#tabbar').innerHTML = TABS.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
  qsa('.tab-btn').forEach(btn => btn.onclick = () => { state.tab = btn.dataset.tab; renderTab(); });
  qs('#btn-prev').onclick = () => moverFecha(-1);
  qs('#btn-next').onclick = () => moverFecha(1);
  qs('#btn-hoy').onclick = () => { state.fecha = todayISO(); onFechaChange(); };
  qs('#date-picker').onchange = (e) => { if (e.target.value){ state.fecha = e.target.value; onFechaChange(); } };
  qs('#btn-settings').onclick = () => showConfig();
}

function wireGlobalActions(){
  qs('#content').addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'jump-fecha'){
      state.fecha = el.dataset.fecha;
      state.tab = 'diario';
      onFechaChange();
      return;
    }
    if (DELETE_ACTIONS[action]){
      if (!confirm('¿Eliminar este elemento?')) return;
      try {
        await DELETE_ACTIONS[action](el.dataset.id);
        toast('Eliminado');
        if (currentRenderFn) currentRenderFn();
      } catch (err) { toast('No se pudo eliminar'); }
    }
  });
  qs('#content').addEventListener('change', async (e) => {
    const el = e.target.closest('[data-toggle]');
    if (!el) return;
    try {
      if (el.dataset.toggle === 'tarea'){
        await patch(`/matriz/${el.dataset.id}/${el.checked ? 'completar' : 'reabrir'}`);
      } else if (el.dataset.toggle === 'proyecto'){
        await patch(`/proyectos/${el.dataset.id}`, { estado: el.value });
      }
      if (currentRenderFn) currentRenderFn();
    } catch (err) { toast('No se pudo actualizar'); }
  });
}

function onFechaChange(){
  qs('#date-picker').value = state.fecha;
  qs('#date-readable').textContent = fechaLegible(state.fecha);
  renderTab();
}

async function renderTab(){
  qsa('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const map = {
    diario: renderDiario, habitos: renderHabitos, conocimiento: renderConocimiento,
    ejercicio: renderEjercicioSueno, alimentacion: renderAlimentacion,
    finanzas: renderFinanzas, matriz: renderMatriz,
  };
  currentRenderFn = map[state.tab];
  qs('#content').innerHTML = `<div class="dim" style="padding:32px 0;text-align:center;">Cargando…</div>`;
  try {
    await currentRenderFn();
  } catch (err) {
    console.error(err);
    qs('#content').innerHTML = `<div class="card"><b>No se pudo cargar esta sección.</b><div class="dim" style="margin-top:6px;">${esc(err.message || err)}</div></div>`;
  }
}

/* ================= 1. Diario ================= */
async function renderDiario(){
  qs('#content').innerHTML = `
    <div class="card">
      <textarea id="diario-texto" class="textarea" placeholder="Escribe algo sobre hoy…"></textarea>
      <div class="row-between" style="margin-top:10px;">
        <span id="diario-meta" class="dim"></span>
        <button class="btn" id="diario-guardar">Guardar</button>
      </div>
    </div>
    <div class="section-title">Histórico</div>
    <div id="diario-historico"></div>
  `;
  const [entry, historico] = await Promise.all([get(`/diario/${state.fecha}`), get('/diario')]);
  qs('#diario-texto').value = entry ? entry.contenido : '';
  qs('#diario-meta').textContent = entry && entry.actualizado_en ? `Actualizado ${entry.actualizado_en.replace('T',' ')}` : 'Sin guardar todavía';
  qs('#diario-guardar').onclick = async () => {
    await put(`/diario/${state.fecha}`, { contenido: qs('#diario-texto').value });
    toast('Guardado');
    renderDiario();
  };
  const lista = historico.filter(h => h.fecha !== state.fecha).slice(0, 30);
  qs('#diario-historico').innerHTML = lista.length ? lista.map(h => `
    <div class="card small" style="cursor:pointer;" data-action="jump-fecha" data-fecha="${h.fecha}">
      <div class="row-between"><b>${fechaLegible(h.fecha)}</b><span class="dim">${h.fecha}</span></div>
      <div class="dim" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(h.contenido)}</div>
    </div>`).join('') : '<div class="dim">Aún no hay entradas anteriores.</div>';
}

/* ================= 2. Hábitos ================= */
async function renderHabitos(){
  qs('#content').innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0;">Registrar hábito de hoy</div>
      <div class="row">
        <select id="hab-select" class="select"></select>
        <input id="hab-tiempo" class="input" placeholder="Tiempo (ej. 20 min)">
      </div>
      <div class="row">
        <select id="hab-calif" class="select">${opcionesCalificacion()}</select>
        <input id="hab-nota" class="input" placeholder="Nota (opcional)">
      </div>
      <button class="btn" id="hab-agregar" style="width:100%;">Agregar registro</button>
    </div>
    <div class="section-title">Hoy</div>
    <div class="card" id="hab-lista"></div>
    <div class="section-title">Tus hábitos</div>
    <div class="card">
      <div class="row">
        <input id="hab-nuevo" class="input" placeholder="Nombre del nuevo hábito">
        <button class="btn-secondary btn" id="hab-crear">Agregar</button>
      </div>
      <div id="hab-catalogo"></div>
    </div>
  `;
  const [habitos, registros] = await Promise.all([get('/habitos'), get(`/habitos/registro/${state.fecha}`)]);
  qs('#hab-select').innerHTML = habitos.length ? habitos.map(h => `<option value="${h.id}">${esc(h.nombre)}</option>`).join('') : '<option value="">(crea un hábito primero)</option>';
  qs('#hab-lista').innerHTML = registros.length ? registros.map(r => registroRow(r, r.habito_nombre, 'del-habito-reg')).join('') : '<div class="dim">Sin registros hoy.</div>';
  qs('#hab-catalogo').innerHTML = habitos.length ? habitos.map(h => `
    <div class="item-row"><div>${esc(h.nombre)}</div><button class="btn-x" data-action="del-habito" data-id="${h.id}">✕</button></div>
  `).join('') : '<div class="dim">Aún no tienes hábitos. Agrega el primero arriba.</div>';

  qs('#hab-agregar').onclick = async () => {
    const habito_id = qs('#hab-select').value;
    if (!habito_id){ toast('Crea un hábito primero'); return; }
    await post('/habitos/registro', {
      habito_id: Number(habito_id), fecha: state.fecha,
      tiempo: qs('#hab-tiempo').value, calificacion: Number(qs('#hab-calif').value), nota: qs('#hab-nota').value,
    });
    renderHabitos();
  };
  qs('#hab-crear').onclick = async () => {
    const nombre = qs('#hab-nuevo').value.trim();
    if (!nombre) return;
    await post('/habitos', { nombre });
    renderHabitos();
  };
}

/* ================= 3. Conocimiento ================= */
async function renderConocimiento(){
  qs('#content').innerHTML = `
    <div class="section-title" style="margin-top:0;">Conocimiento adquirido hoy</div>
    <div class="card">
      <div class="row"><input id="con-nuevo" class="input" placeholder="¿Qué aprendiste hoy?"><button class="btn" id="con-agregar">Agregar</button></div>
      <div id="con-lista"></div>
    </div>
    <div class="section-title">Proyectos intelectuales</div>
    <div class="card">
      <div class="row"><input id="proy-nuevo" class="input" placeholder="Nombre del proyecto"><button class="btn" id="proy-agregar">Agregar</button></div>
      <div id="proy-lista"></div>
    </div>
    <div class="section-title">Temas de aprendizaje</div>
    <div class="card">
      <div class="row">
        <select id="tema-select" class="select"></select>
        <input id="tema-tiempo" class="input" placeholder="Tiempo (ej. 20 min)">
      </div>
      <div class="row">
        <select id="tema-calif" class="select">${opcionesCalificacion()}</select>
        <input id="tema-nota" class="input" placeholder="Nota (opcional)">
      </div>
      <button class="btn" id="tema-agregar" style="width:100%;">Agregar registro</button>
      <div id="tema-lista" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <div class="row"><input id="tema-nuevo" class="input" placeholder="Nuevo tema (ej. Inglés)"><button class="btn-secondary btn" id="tema-crear">Agregar tema</button></div>
      <div id="tema-catalogo"></div>
    </div>
  `;
  const [conocimientos, proyectos, temas, registrosTema] = await Promise.all([
    get(`/conocimientos?fecha=${state.fecha}`), get(`/proyectos?fecha=${state.fecha}`),
    get('/temas'), get(`/temas/registro/${state.fecha}`),
  ]);

  qs('#con-lista').innerHTML = listaSimple(conocimientos, { textKey:'descripcion', action:'del-conocimiento' });
  qs('#con-agregar').onclick = async () => {
    const descripcion = qs('#con-nuevo').value.trim();
    if (!descripcion) return;
    await post('/conocimientos', { fecha: state.fecha, descripcion });
    renderConocimiento();
  };

  qs('#proy-lista').innerHTML = proyectos.length ? proyectos.map(p => `
    <div class="item-row">
      <div>${esc(p.nombre)}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <select class="select" style="width:auto;" data-toggle="proyecto" data-id="${p.id}">
          <option value="activo" ${p.estado==='activo'?'selected':''}>Activo</option>
          <option value="completado" ${p.estado==='completado'?'selected':''}>Completado</option>
          <option value="pausado" ${p.estado==='pausado'?'selected':''}>Pausado</option>
        </select>
        <button class="btn-x" data-action="del-proyecto" data-id="${p.id}">✕</button>
      </div>
    </div>`).join('') : '<div class="dim">Sin proyectos hoy.</div>';
  qs('#proy-agregar').onclick = async () => {
    const nombre = qs('#proy-nuevo').value.trim();
    if (!nombre) return;
    await post('/proyectos', { fecha: state.fecha, nombre });
    renderConocimiento();
  };

  qs('#tema-select').innerHTML = temas.length ? temas.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('') : '<option value="">(crea un tema primero)</option>';
  qs('#tema-lista').innerHTML = registrosTema.length ? registrosTema.map(r => registroRow(r, r.tema_nombre, 'del-tema-reg')).join('') : '<div class="dim">Sin registros hoy.</div>';
  qs('#tema-catalogo').innerHTML = temas.length ? temas.map(t => `
    <div class="item-row"><div>${esc(t.nombre)}</div><button class="btn-x" data-action="del-tema" data-id="${t.id}">✕</button></div>
  `).join('') : '<div class="dim">Aún no tienes temas.</div>';
  qs('#tema-agregar').onclick = async () => {
    const tema_id = qs('#tema-select').value;
    if (!tema_id){ toast('Crea un tema primero'); return; }
    await post('/temas/registro', {
      tema_id: Number(tema_id), fecha: state.fecha,
      tiempo: qs('#tema-tiempo').value, calificacion: Number(qs('#tema-calif').value), nota: qs('#tema-nota').value,
    });
    renderConocimiento();
  };
  qs('#tema-crear').onclick = async () => {
    const nombre = qs('#tema-nuevo').value.trim();
    if (!nombre) return;
    await post('/temas', { nombre });
    renderConocimiento();
  };
}

/* ================= 4. Ejercicio y sueño ================= */
async function renderEjercicioSueno(){
  qs('#content').innerHTML = `
    <div class="section-title" style="margin-top:0;">Ejercicio</div>
    <div class="card">
      <div class="row">
        <input id="ej-nombre" class="input" placeholder="Ejercicio (ej. Sentadillas)">
        <input id="ej-reps" class="input" placeholder="Repeticiones">
      </div>
      <div class="row">
        <input id="ej-tiempo" class="input" placeholder="Tiempo">
        <select id="ej-calif" class="select">${opcionesCalificacion()}</select>
      </div>
      <button class="btn" id="ej-agregar" style="width:100%;">Agregar</button>
      <div id="ej-lista" style="margin-top:8px;"></div>
    </div>
    <div class="section-title">Sueño</div>
    <div class="card">
      <div class="row">
        <input id="sue-horas" type="number" step="0.5" min="0" max="24" class="input" placeholder="Horas dormidas">
        <select id="sue-calidad" class="select">${opcionesCalificacion()}</select>
      </div>
      <input id="sue-nota" class="input" placeholder="Nota (opcional)">
      <button class="btn" id="sue-guardar" style="width:100%;margin-top:10px;">Guardar</button>
    </div>
  `;
  const [ejercicios, sueno] = await Promise.all([get(`/ejercicios/${state.fecha}`), get(`/sueno/${state.fecha}`)]);
  qs('#ej-lista').innerHTML = ejercicios.length ? ejercicios.map(e => `
    <div class="item-row">
      <div><b>${esc(e.nombre)}</b>
        <div class="dim">${[e.repeticiones, e.tiempo].filter(Boolean).map(esc).join(' · ')}${e.calificacion ? ' · '+'★'.repeat(e.calificacion) : ''}</div>
      </div>
      <button class="btn-x" data-action="del-ejercicio" data-id="${e.id}">✕</button>
    </div>`).join('') : '<div class="dim">Sin ejercicios hoy.</div>';
  qs('#ej-agregar').onclick = async () => {
    const nombre = qs('#ej-nombre').value.trim();
    if (!nombre) return;
    await post('/ejercicios', {
      fecha: state.fecha, nombre, repeticiones: qs('#ej-reps').value, tiempo: qs('#ej-tiempo').value,
      calificacion: Number(qs('#ej-calif').value),
    });
    renderEjercicioSueno();
  };

  qs('#sue-horas').value = sueno && sueno.horas != null ? sueno.horas : '';
  if (sueno && sueno.calidad) qs('#sue-calidad').value = sueno.calidad;
  qs('#sue-nota').value = sueno && sueno.nota ? sueno.nota : '';
  qs('#sue-guardar').onclick = async () => {
    await put(`/sueno/${state.fecha}`, {
      horas: qs('#sue-horas').value ? Number(qs('#sue-horas').value) : null,
      calidad: Number(qs('#sue-calidad').value), nota: qs('#sue-nota').value,
    });
    toast('Guardado');
    renderEjercicioSueno();
  };
}

/* ================= 5. Alimentación ================= */
async function renderAlimentacion(){
  const tipos = [['desayuno','Desayuno'],['comida','Comida'],['cena','Cena'],['extra','Extras']];
  qs('#content').innerHTML = tipos.map(([key,label], i) => `
    <div class="section-title" style="margin-top:${i===0?'0':'20px'};">${label}</div>
    <div class="card">
      <div class="row"><input id="ali-${key}-nuevo" class="input" placeholder="¿Qué comiste?"><button class="btn ali-agregar" data-tipo="${key}">Agregar</button></div>
      <div id="ali-${key}-lista"></div>
    </div>`).join('');

  const items = await get(`/alimentacion/${state.fecha}`);
  tipos.forEach(([key]) => {
    const deEsteTipo = items.filter(i => i.tipo === key);
    qs(`#ali-${key}-lista`).innerHTML = listaSimple(deEsteTipo, { textKey:'descripcion', action:'del-alimento' });
  });
  qsa('.ali-agregar').forEach(btn => {
    btn.onclick = async () => {
      const tipo = btn.dataset.tipo;
      const input = qs(`#ali-${tipo}-nuevo`);
      const descripcion = input.value.trim();
      if (!descripcion) return;
      await post('/alimentacion', { fecha: state.fecha, tipo, descripcion });
      renderAlimentacion();
    };
  });
}

/* ================= 6. Finanzas ================= */
async function renderFinanzas(){
  qs('#content').innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0;">Patrimonio</div>
      <div id="fin-patrimonio" style="font-size:28px;font-weight:700;"></div>
      <div id="fin-balances" style="margin-top:10px;"></div>
    </div>
    <div class="section-title">Movimiento del día</div>
    <div class="card">
      <div class="row"><select id="mov-debe" class="select"></select><select id="mov-haber" class="select"></select></div>
      <div class="row">
        <input id="mov-monto" type="number" step="0.01" class="input" placeholder="Monto">
        <input id="mov-concepto" class="input" placeholder="Concepto (opcional)">
      </div>
      <button class="btn" id="mov-agregar" style="width:100%;">Agregar movimiento</button>
      <div id="mov-lista" style="margin-top:8px;"></div>
    </div>
    <div class="section-title">Cuentas</div>
    <div class="card">
      <div class="row">
        <input id="cta-nombre" class="input" placeholder="Nombre de la cuenta">
        <label class="dim" style="display:flex;align-items:center;gap:6px;flex:0 0 auto;">
          <input type="checkbox" id="cta-incluye" checked> Suma al patrimonio
        </label>
      </div>
      <button class="btn-secondary btn" id="cta-crear" style="width:100%;">Agregar cuenta</button>
      <div id="cta-lista" style="margin-top:8px;"></div>
    </div>
    <div class="section-title">Compras del día</div>
    <div class="card">
      <div class="row">
        <input id="com-desc" class="input" placeholder="Descripción">
        <input id="com-monto" type="number" step="0.01" class="input" placeholder="Monto">
      </div>
      <button class="btn" id="com-agregar" style="width:100%;">Agregar compra</button>
      <div id="com-lista" style="margin-top:8px;"></div>
      <div class="row-between" style="margin-top:8px;"><b>Total del día</b><span id="com-total"></span></div>
    </div>
    <div class="section-title">Ideas de negocio</div>
    <div class="card">
      <div class="row"><input id="idea-nueva" class="input" placeholder="Nueva idea"><button class="btn" id="idea-agregar">Agregar</button></div>
      <div id="idea-lista"></div>

  const [balances, patrimonio, cuentas, movimientos, compras, comprasTotal, ideas] = await Promise.all([
    get('/finanzas/balances'), get('/finanzas/patrimonio'), get('/cuentas'),
    get(`/movimientos/${state.fecha}`), get(`/compras/${state.fecha}`),
    get(`/compras/${state.fecha}/total`), get(`/ideas-negocio?fecha=${state.fecha}`),
  ]);

  qs('#fin-patrimonio').textContent = fmtMoneda(patrimonio.total);
  qs('#fin-balances').innerHTML = balances.map(b => `
    <div class="row-between" style="padding:4px 0;"><span class="dim">${esc(b.cuenta.nombre)}</span><span>${fmtMoneda(b.saldo)}</span></div>
  `).join('');

  const opcionesCuentas = cuentas.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  qs('#mov-debe').innerHTML = opcionesCuentas;
  qs('#mov-haber').innerHTML = opcionesCuentas;

  qs('#mov-lista').innerHTML = movimientos.length ? movimientos.map(m => `
    <div class="item-row">
      <div>${esc(m.cuenta_haber_nombre)} → ${esc(m.cuenta_debe_nombre)}: <b>${fmtMoneda(m.monto)}</b>
        ${m.concepto ? `<div class="dim">${esc(m.concepto)}</div>` : ''}</div>

/* ================= 7. Matriz maestra ================= */
async function renderMatriz(){
  qs('#content').innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0;">Nueva tarea</div>
      <input id="mtz-titulo" class="input" placeholder="Título de la tarea" style="margin-bottom:8px;">
      <div class="row">
        <input id="mtz-plazo" class="input" list="mtz-plazos-list" placeholder="Plazo" value="3 meses">
        <datalist id="mtz-plazos-list"></datalist>
        <select id="mtz-prioridad" class="select">
          <option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option>
        </select>
      </div>
      <button class="btn" id="mtz-agregar" style="width:100%;">Agregar a la matriz</button>
    </div>
    <div class="matriz-grid" id="mtz-grid"></div>
  `;
  const PLAZOS_BASE = ['3 meses', '6 meses', '1 año', 'Sin definir'];
  const [tareas, plazosExistentes] = await Promise.all([get('/matriz'), get('/matriz/plazos')]);
  const plazos = [...new Set([...PLAZOS_BASE, ...plazosExistentes])];
  qs('#mtz-plazos-list').innerHTML = plazos.map(p => `<option value="${esc(p)}"></option>`).join('');

  const colorPrioridad = { alta: 'var(--bad)', media: 'var(--accent)', baja: 'var(--fg-dim)' };
  qs('#mtz-grid').innerHTML = plazos
    .filter(p => tareas.some(t => t.plazo === p) || PLAZOS_BASE.includes(p))
    .map(plazo => {
      const deEstePlazo = tareas.filter(t => t.plazo === plazo);
      return `<div class="card">
        <div class="section-title" style="margin-top:0;">${esc(plazo)}</div>
        ${deEstePlazo.length ? deEstePlazo.map(t => `
          <div class="item-row">
            <label style="display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;">
              <input type="checkbox" data-toggle="tarea" data-id="${t.id}" ${t.estado==='completada'?'checked':''} style="margin-top:3px;">
              <span style="${t.estado==='completada' ? 'color:var(--fg-dim);text-decoration:line-through;' : `color:${colorPrioridad[t.prioridad]||'var(--fg)'};`}">${esc(t.titulo)}</span>
            </label>
            <button class="btn-x" data-action="del-tarea" data-id="${t.id}">✕</button>
          </div>`).join('') : '<div class="dim">Sin tareas.</div>'}
      </div>`;
    }).join('');

  qs('#mtz-agregar').onclick = async () => {
    const titulo = qs('#mtz-titulo').value.trim();
    const plazo = qs('#mtz-plazo').value.trim();
    const prioridad = qs('#mtz-prioridad').value;
    if (!titulo || !plazo){ toast('Escribe la tarea y el plazo'); return; }
    await post('/matriz', { titulo, plazo, prioridad });
    qs('#mtz-titulo').value = '';
    renderMatriz();
  };
}

/* ================= Config / arranque ================= */
function showConfig(msg){
  qs('#app-screen').classList.add('hidden');
  qs('#config-screen').classList.remove('hidden');
  qs('#cfg-url').value = state.apiBase || '';
  qs('#cfg-key').value = state.apiKey || '';
  qs('#cfg-error').textContent = msg || '';
  qs('#cfg-cancelar').style.display = (state.apiBase && state.apiKey) ? 'block' : 'none';
}
function hideConfig(){
  qs('#config-screen').classList.add('hidden');
  qs('#app-screen').classList.remove('hidden');
}
function wireConfigScreen(){
  qs('#cfg-guardar').onclick = async () => {
    const url = qs('#cfg-url').value.trim().replace(/\/$/, '');
    const key = qs('#cfg-key').value.trim();
    const errEl = qs('#cfg-error');
    errEl.textContent = '';
    if (!url || !key){ errEl.textContent = 'Completa ambos campos.'; return; }
    try {
      const h = await fetch(url + '/health');
      if (!h.ok) throw new Error('No se pudo contactar el servidor.');
      const test = await fetch(url + '/habitos', { headers: { 'X-API-Key': key } });
      if (test.status === 401) throw new Error('Clave API incorrecta.');
      if (!test.ok) throw new Error('El servidor respondió con un error.');
    } catch (e) {
      errEl.textContent = e.message || 'No se pudo conectar. Revisa la URL.';
      return;
    }
    localStorage.setItem('dr_api_base', url);
    localStorage.setItem('dr_api_key', key);
    state.apiBase = url; state.apiKey = key;
    hideConfig();
    onFechaChange();
  };
  qs('#cfg-cancelar').onclick = () => hideConfig();
}

function boot(){
  buildShell();
  wireGlobalActions();
  wireConfigScreen();
  if (state.apiBase && state.apiKey){
    hideConfig();
    onFechaChange();
  } else {
    showConfig();
  }
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
